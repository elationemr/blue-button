name: generate-lambda-package

on: [push, pull_request]

jobs:
  generate-lambda-package:
    strategy:
      matrix:
        platform:
          - ubuntu-latest
    name: Generate lambda package
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repo
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 12
      - name: Install dependencies
        run: |
          npm install --production
      - name: Package the library
        run: npm pack
      - name: Convert to zip file
        run: tar xzf blue-button-1.10.1.tgz && zip package.zip $(tar tf blue-button-1.10.1.tgz)
      - name: Archive code coverage results
        uses: actions/upload-artifact@v3
        with:
          name: lambda-layer-zip
          path: package.zip
